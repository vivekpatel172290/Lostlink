<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="ambientCyber" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#080B14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Canvas Surface -->
  <rect width="300" height="200" fill="#0E1322"/>
  <rect width="300" height="200" fill="url(#ambientCyber)"/>
  <rect x="0.5" y="0.5" width="299" height="199" fill="none" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1"/>

  <!-- Subtle Circuit Grid -->
  <path d="M0 50 H300 M0 100 H300 M0 150 H300 M75 0 V200 M150 0 V200 M225 0 V200" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- Glowing Center Link Badge -->
  <circle cx="150" cy="82" r="38" fill="#141B30" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
  <circle cx="150" cy="82" r="38" fill="url(#cyberGlow)"/>

  <!-- Cyber Node & Search Icon -->
  <circle cx="145" cy="77" r="16" fill="none" stroke="#00F2FE" stroke-width="2.5"/>
  <line x1="157" y1="89" x2="169" y2="101" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="145" cy="77" r="5" fill="#6366F1"/>

  <!-- Monospace Cyber Indicators -->
  <text x="150" y="146" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="1.5">NO PHOTO UPLOADED</text>
  <text x="150" y="164" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1.2">// CLIP NEURAL TEXT MATCH ACTIVE</text>
</svg>
